{{define "scope"}}
<section class="scope" aria-labelledby="scope-title">
  <div class="section-head"><h2 id="scope-title">双声道光学读数</h2><span id="scope-clock" class="section-note"></span></div>
  <div class="scope-plot">
    <div class="lane-labels" aria-hidden="true"><span>左</span><span>右</span></div>
    <canvas id="waveform" aria-label="双声道波形，点击定位画格行"></canvas>
  </div>
  <div class="scope-legend" aria-label="取样覆盖图例">
    <span class="readable">可读</span><span class="missing">声槽缺页</span><span class="outside">移出卷界</span>
  </div>
  <div id="coverage-list" class="coverage-list" aria-label="声槽覆盖区间"></div>
  <div class="audition"><button type="button" id="audition-button" disabled>载入试听</button><audio id="audition-media" controls preload="none" aria-label="当前区间的双声道试听" hidden></audio><span id="audition-status" role="status"></span></div>
</section>
{{end}}
