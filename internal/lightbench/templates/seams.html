{{define "seams"}}
<section class="detail seams-section" aria-labelledby="seams-title">
  <div class="section-head">
    <h2 id="seams-title">页接缝检查</h2>
    <span id="seams-summary" class="section-note" role="status">正在读取页边界…</span>
  </div>
  <p class="muted small seams-hint">逐页比较画面列区的整页亮度与行剖面结构；声槽按声画偏移独立定位，画面变暗与声音跳变可能不在同一源页。</p>
  <ul id="seams-list" class="seams-list" aria-label="扫描页接缝判定"></ul>
  <p id="seams-status" class="parcel-status" role="status"></p>
</section>
{{end}}
