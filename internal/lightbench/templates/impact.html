{{define "impact"}}<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emberstripe · 撕边影响图</title>
  <link rel="stylesheet" href="/light-assets/styles/base.css">
  <link rel="stylesheet" href="/light-assets/styles/bench.css">
  <link rel="stylesheet" href="/light-assets/styles/details.css">
  <link rel="stylesheet" href="/light-assets/styles/impact.css">
  <script type="module" src="/light-assets/scripts/impact.js"></script>
</head>
<body>
<header class="masthead">
  <div class="masthead-inner">
    <a class="identity" href="/" aria-label="Emberstripe 工作台首页">
      <span class="optical-mark" aria-hidden="true"></span>
      <span>Emberstripe<small>撕边交叉扫描影响图</small></span>
    </a>
    <nav class="reel-index" aria-label="扫描卷索引">
      {{range .Names}}<a href="/lightbench/{{.}}">{{.}}</a>{{end}}
      <a href="/lightbench/impact-map" aria-current="page">撕边影响图</a>
    </nav>
  </div>
</header>
<main class="bench impact-bench">
  <section class="panel impact-editor">
    <h1>撕边影响图交接</h1>
    <p class="hint">
      填入修复员在两次扫描中共同认定的参照点和原扫撕边坐标。系统不会把片孔重复纹当作匹配；
      每份页证只代表其所属扫描卷，补扫页不会写成原扫证据。
    </p>
    <label for="survey">调查 JSON</label>
    <textarea id="survey" spellcheck="false" rows="18"></textarea>
    <div class="actions">
      <button id="generate" type="button">生成影响图</button>
      <button id="markdown" type="button" class="secondary">下载 Markdown</button>
      <span id="status" role="status" aria-live="polite"></span>
    </div>
  </section>
  <section id="report" class="impact-report" aria-live="polite"></section>
</main>
</body>
</html>{{end}}
