{{define "masthead"}}
<header class="masthead">
  <div class="masthead-inner">
    <a class="identity" href="/" aria-label="Emberstripe 工作台首页"><span class="optical-mark" aria-hidden="true"></span><span>Emberstripe<small>胶片声轨工作台</small></span></a>
    {{if .Names}}
    <nav class="reel-index" aria-label="扫描卷索引">
      {{range .Names}}
      <a href="/lightbench/{{.}}" {{if $.Reel}}{{if eq . $.Reel.Name}}aria-current="page"{{end}}{{end}}>{{.}}</a>
      {{end}}
    </nav>
    {{end}}
  </div>
  {{if .Reel}}
  <div class="tool-strip">
    <nav class="tool-index" aria-label="卷内工位">
      <a href="/lightbench/{{.Reel.Name}}" {{if not .TabletActive}}aria-current="page"{{end}}>声轨工作台</a>
      {{if .Reel.Tablet}}<a href="/lightbench/{{.Reel.Name}}/tablet" {{if .TabletActive}}aria-current="page"{{end}}>试条评估</a>{{end}}
    </nav>
    {{if .TabletActive}}<a class="tool-json" href="{{.JSONPath}}?profile={{.Active}}" data-json-link>评估 JSON</a>{{end}}
  </div>
  {{end}}
</header>
{{end}}
